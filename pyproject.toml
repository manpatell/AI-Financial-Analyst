[project]
name = "ledgerline-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["sim", "backend"]

[tool.uv.sources]
ledgerline-sim = { workspace = true }
ledgerline = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ledgerline-sim",
    "ledgerline",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"sim/src/ledgerline_sim/catalog.py" = ["E501"]  # data table
"backend/migrations/versions/*" = ["E501"]  # autogenerated
"sim/src/ledgerline_sim/cli.py" = ["B008"]  # typer.Option defaults are the Typer idiom

[tool.ruff.lint.isort]
known-first-party = ["ledgerline", "ledgerline_sim"]

[tool.pytest.ini_options]
testpaths = ["sim/tests", "backend/tests"]
