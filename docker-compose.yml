# Dev Postgres for Ledgerline (port 5433 so it never clashes with a native Postgres on 5432).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ledgerline
      POSTGRES_DB: ledgerline
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
